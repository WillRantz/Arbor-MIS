ransparent 46px,#eef1f6 47px)}.bar-group{flex:1;display:flex;align-items:center;justify-content:end;gap:4px;flex-direction:column;height:100%}.bars{height:150px;display:flex;align-items:end;gap:4px;width:100%;justify-content:center}.bar{width:min(24px,40%);border-radius:5px 5px 0 0;min-height:3px}.bar.pos{background:#4b82e7}.bar.neg{background:#ee8b8b}.bar-label{font-size:10px;color:var(--muted);padding:8px 0}.legend{display:flex;gap:14px;font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.activity{display:grid;gap:15px}.activity-item{display:flex;gap:11px;align-items:flex-start}.activity-icon{width:32px;height:32px;flex-shrink:0;border-radius:10px;display:grid;place-items:center}.activity-copy{min-width:0;flex:1;font-size:12px;line-height:1.45}.activity-copy strong{font-size:12px}.activity-copy small{display:block;color:var(--muted);margin-top:3px}.pill{display:inline-flex;align-items:center;border-radius:100px;padding:4px 8px;font-size:10px;font-weight:800;white-space:nowrap}.pill-positive{color:var(--green);background:var(--greenbg)}.pill-negative{color:var(--red);background:var(--redbg)}.pill-blue{color:#168452;background:#e8f7ef}.pill-amber{color:#946200;background:#fff5d9}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid var(--line)}.toolbar input{max-width:280px}.toolbar select{width:auto;min-width:130px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#7b8799;font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;background:#fbfcfe}th,td{padding:13px 18px;border-bottom:1px solid #edf0f5}td{font-size:12px}tbody tr:hover{background:#fafcff}.student-cell{display:flex;align-items:center;gap:9px}.mini-avatar{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:#edf1fb;color:#4d64a6;font-size:11px;font-weight:800}.student-name{font-weight:750}.subline{font-size:10px;color:var(--muted);margin-top:3px}.table-foot{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;color:var(--muted);font-size:11px}.two-col{grid-template-columns:1fr 1fr}.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.level-option{border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 4px;text-align:center;cursor:pointer}.level-option strong{display:block;font-size:15px;margin-bottom:5px}.level-option span{display:block;font-size:10px;color:var(--muted)}.level-option.selected{border-color:var(--blue);background:var(--blue2);box-shadow:0 0 0 2px #3767d61a}.level-option.neg-selected{border-color:var(--red);background:#fff0f0;box-shadow:0 0 0 2px #c53b451a}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span-2{grid-column:1/-1}.notice{padding:12px 14px;border-radius:10px;background:#f2f6ff;color:#3555a0;font-size:12px;line-height:1.5}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.empty .big{font-size:30px;margin-bottom:8px}.profile-top{display:flex;align-items:center;gap:15px;padding:20px}.profile-avatar{width:66px;height:66px;border-radius:18px;background:#e7edff;color:#315ac2;display:grid;place-items:center;font-size:23px;font-weight:800}.profile-top h2{margin:0 0 5px}.profile-stats{grid-template-columns:repeat(3,1fr)}.toast{position:fixed;bottom:22px;right:22px;background:#172742;color:#fff;border-radius:12px;padding:13px 18px;box-shadow:0 12px 30px #0002;font-size:13px;z-index:50;max-width:360px}.modal-backdrop{position:fixed;inset:0;background:#0b183c77;display:grid;place-items:center;padding:18px;z-index:30}.modal{background:white;border-radius:18px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 70px #09152c55}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:17px;margin:0}.modal-body{padding:18px 22px}.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.close-btn{border:0;background:transparent;font-size:22px;color:var(--muted)}.level-row{display:grid;grid-template-columns:100px 100px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.level-row input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}.mobile-menu{display:none}

.alert-card h3,.notice-card h3{margin:0 0 7px;font-size:15px}.message-meta{font-size:11px;color:var(--muted);margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}.message-body{font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.message-actions{display:flex;gap:7px;align-items:center;margin-top:10px}.message-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.message-tabs .btn{border-radius:9px}

<body>
<div id="loginScreen" class="login-wrap">
  <form id="loginForm" class="login-card">
    <div class="brandmark">✦</div>
    <h1>Welcome back</h1><p class="muted" style="margin:0 0 23px;font-size:13px">Sign in to Arbor MIS</p>
    <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required placeholder="Enter your username" value="admin"></div>
    <div class="field"><label for="password">Password</label><div class="password-row"><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password" value="School123!"><button class="btn btn-outline" type="button" id="togglePassword">Show</button></div></div>
    <button class="btn btn-primary full" type="submit" style="margin-top:8px">Log in →</button>
    <div id="loginError" class="muted" style="color:#c53b45;font-size:12px;margin-top:10px"></div>
  </form>
</div>

<div id="app" class="app hidden">
<aside id="sidebar" class="sidebar">
  <div class="side-brand"><div class="side-icon">✦</div><div>Arbor MIS<div style="font-size:10px;font-weight:500;color:#9eafca;margin-top:3px">BEHAVIOUR & POINTS</div></div></div>
  <div class="nav-label">Workspace</div>
  <button class="nav-btn active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
  <button class="nav-btn" data-page="students"><span class="ico">♙</span>Students</button>
  <button class="nav-btn" data-page="behaviour"><span class="ico">◉</span>Behaviour log</button>
  <button class="nav-btn" data-page="award"><span class="ico">＋</span>Award / record points</button>
  <div class="nav-label">School management</div>
  <button class="nav-btn" data-page="classes"><span class="ico">▤</span>Classes & year groups</button>
  <button class="nav-btn" data-page="reports"><span class="ico">▥</span>Reports & analytics</button>
  <button class="nav-btn" data-page="settings"><span class="ico">⚙</span>Points settings</button>
  <div class="side-bottom">Arbor MIS <br>OHMS</div>
</aside>
<main class="main">
<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="btn btn-outline mobile-menu" id="mobileMenu">☰</button><div><div class="crumb">School Management / <span id="crumb">Dashboard</span></div><div class="top-title" id="topTitle">Dashboard overview</div></div></div>
  <div class="top-actions"><button class="btn btn-outline btn-sm" id="headerAward">＋ Award points</button><div class="user-chip"><div class="avatar">AD</div><div class="user-name">Alex Morgan<div class="muted" style="font-size:10px;font-weight:500">Super Admin</div></div></div><button class="btn btn-outline btn-sm" id="logoutBtn">Log out</button></div>
</header>
<div id="content" class="content"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const DEFAULT_LEVELS = {
 positive:[
  {name:"Level 1",points:1,description:"Small achievement or positive behaviour"},
  {name:"Level 2",points:2,description:"Good effort or positive contribution"},
  {name:"Level 3",points:3,description:"Excellent effort or achievement"},
  {name:"Level 4",points:5,description:"Outstanding contribution"},
  {name:"Level 5",points:10,description:"Exceptional achievement or recognition"}
 ],
 negative:[
  {name:"Level 1",points:1,description:"Minor behaviour concern"},
  {name:"Level 2",points:2,description:"Repeated or more significant concern"},
  {name:"Level 3",points:3,description:"Serious behaviour incident"},
  {name:"Level 4",points:5,description:"Major incident requiring senior review - Isolation"},
  {name:"Level 5",points:10,description:"Critical incident requiring immediate review - Suspension"}
 ]
};
const seedStudents=[
 {id:"ST1001",first:"William",last:"Holcroft",year:"Year 8",className:"8H",house:"Heywood",status:"Active"},
 {id:"ST1002",first:"Joseph",last:"McCabe",year:"Year 8",className:"8H",house:"Heywood",status:"Active"},
 {id:"ST1003",first:"Ethan",last:"Longmore",year:"Year 8",className:"8B",house:"Bamford",status:"Active"},
 {id:"ST1004",first:"William",last:"Bounds",year:"Year 7",className:"7R",house:"Redfern",status:"Active"},
 {id:"ST1005",first:"Kyle",last:"Davies",year:"Year 8",className:"8J",house:"Johnson",status:"Active"},
 {id:"ST1006",first:"George",last:"Gregson",year:"Year 5",className:"5J",house:"Johnson",status:"Active"},
 {id:"ST1007",first:"Freya",last:"Cleary",year:"Year 8",className:"8H",house:"Heywood",status:"Active"},
 {id:"ST1008",first:"Rory",last:"McCullagh",year:"Year 8",className:"8H",house:"Heywood",status:"Active"},
 {id:"ST1009",first:"Douglas",last:"Oldham",year:"Year 8",className:"8H",house:"Heywood",status:"Active"},
];
const today=new Date().toISOString().slice(0,10);
const seedEntries=[
 
];
let state={students:[],entries:[],levels:DEFAULT_LEVELS,classes:["7A","8B","9C","10A","11A"],years:["Year 7","Year 8","Year 9","Year 10","Year 11"],currentPage:"dashboard",selectedStudent:null,filters:{search:"",type:"all",year:"all",className:"all"}};
const $=id=>document.getElementById(id);
function loadData(){try{const s=localStorage.getItem("schoolMISPrototype");if(s){const p=JSON.parse(s);state.students=p.students||seedStudents;state.entries=p.entries||seedEntries;state.levels=p.levels||DEFAULT_LEVELS;state.classes=p.classes||state.classes;state.years=p.years||state.years;}else{state.students=seedStudents;state.entries=seedEntries;state.levels=JSON.parse(JSON.stringify(DEFAULT_LEVELS));saveData();}}catch(e){state.students=seedStudents;state.entries=seedEntries;state.levels=JSON.parse(JSON.stringify(DEFAULT_LEVELS));}}
function saveData(){localStorage.setItem("schoolMISPrototype",JSON.stringify({students:state.students,entries:state.entries,levels:state.levels,classes:state.classes,years:state.years}));}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function student(id){return state.students.find(s=>s.id===id)||{id,first:"Unknown",last:"student",year:"—",className:"—"};}
function initials(s){return (s.first[0]||"")+(s.last[0]||"");}
function totals(id){const es=state.entries.filter(e=>e.studentId===id);const pos=es.filter(e=>e.type==="positive").reduce((a,e)=>a+Number(e.points),0);const neg=es.filter(e=>e.type==="negative").reduce((a,e)=>a+Number(e.points),0);return{pos,neg,net:pos-neg};}
function allTotals(){return state.students.reduce((a,s)=>{const t=totals(s.id);a.pos+=t.pos;a.neg+=t.neg;return a;},{pos:0,neg:0});}
function todayEntries(){return state.entries.filter(e=>e.date===today);}
function showToast(msg){$("toastRoot").innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$("toastRoot").innerHTML="",3000);}
const pageTitles={dashboard:"Dashboard overview",students:"Student directory",behaviour:"Behaviour log","award":"Award / record points",classes:"Classes & year groups",reports:"Reports & analytics",settings:"Points settings"};
function go(page){state.currentPage=page;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("crumb").textContent=pageTitles[page]||page;$("topTitle").textContent=pageTitles[page]||page;$("sidebar").classList.remove("open");render();}
function render(){const c=$("content");({dashboard:renderDashboard,students:renderStudents,behaviour:renderBehaviour,award:renderAward,classes:renderClasses,reports:renderReports,settings:renderSettings}[state.currentPage]||renderDashboard)();}
function pageHead(title,desc,actions=""){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;}
function stat(label,num,icon,color,foot){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon" style="background:${color}">${icon}</span></div><div class="stat-num">${num}</div><div class="stat-foot">${foot}</div></div>`;}
function entryName(e){const s=student(e.studentId);return `${s.first} ${s.last}`;}
function entryPill(e){return `<span class="pill ${e.type==="positive"?"pill-positive":"pill-negative"}">${e.type==="positive"?"Positive":"Negative"}</span>`;}
function entryRows(entries,limit=100){if(!entries.length)return `<tr><td colspan="8"><div class="empty"><div class="big">◌</div>No behaviour entries found.</div></td></tr>`;return entries.slice(0,limit).map(e=>{const s=student(e.studentId);return `<tr><td>${esc(e.date)}</td><td><div class="student-cell"><div class="mini-avatar">${esc(initials(s))}</div><div><div class="student-name">${esc(s.first+" "+s.last)}</div><div class="subline">${esc(s.id)}</div></div></div></td><td>${esc(s.className)}</td><td>${entryPill(e)}</td><td>Level ${e.level}</td><td style="font-weight:800;color:${e.type==="positive"?"var(--green)":"var(--red)"}">${e.type==="positive"?"+":"−"}${e.points}</td><td>${esc(e.reason)}</td><td><button class="btn btn-outline btn-sm" onclick="viewEntry(${e.id})">View</button></td></tr>`;}).join("");}
function entriesTable(entries,withTools=true){return `<div class="panel"><div class="panel-head"><h3>Behaviour entries</h3><span class="muted" style="font-size:11px">${entries.length} records</span></div>${withTools?`<div class="toolbar"><input id="entrySearch" placeholder="Search student or reason…" value="${esc(state.filters.search)}"><select id="entryType"><option value="all">All categories</option><option value="positive" ${state.filters.type==="positive"?"selected":""}>Positive</option><option value="negative" ${state.filters.type==="negative"?"selected":""}>Negative</option></select><select id="entryYear"><option value="all">All year groups</option>${state.years.map(y=>`<option ${state.filters.year===y?"selected":""}>${esc(y)}</option>`).join("")}</select></div>`:""}<div class="table-wrap"><table><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Category</th><th>Level</th><th>Points</th><th>Reason</th><th>Action</th></tr></thead><tbody>${entryRows(entries)}</tbody></table></div><div class="table-foot"><span>Showing ${Math.min(entries.length,100)} of ${entries.length} entries</span><button class="btn btn-outline btn-sm" onclick="exportEntries()">Export CSV</button></div></div>`;}
function filteredEntries(){let q=state.filters.search.toLowerCase();return [...state.entries].filter(e=>{const s=student(e.studentId);return(!q||`${s.first} ${s.last} ${s.id} ${e.reason}`.toLowerCase().includes(q))&&(state.filters.type==="all"||e.type===state.filters.type)&&(state.filters.year==="all"||s.year===state.filters.year);}).sort((a,b)=>(b.date+a.id).localeCompare(a.date+b.id));}
function bindEntryFilters(){const s=$("entrySearch"),t=$("entryType"),y=$("entryYear");if(s)s.oninput=()=>{state.filters.search=s.value;refreshEntryTable();};if(t)t.onchange=()=>{state.filters.type=t.value;refreshEntryTable();};if(y)y.onchange=()=>{state.filters.year=y.value;refreshEntryTable();};}
function refreshEntryTable(){const panel=$("content").querySelector(".panel");if(!panel)return;const html=entriesTable(filteredEntries());const wrap=document.createElement("div");wrap.innerHTML=html;panel.replaceWith(wrap.firstElementChild);bindEntryFilters();}
function renderDashboard(){const tt=allTotals(),todayEs=todayEntries(),posToday=todayEs.filter(e=>e.type==="positive").reduce((a,e)=>a+e.points,0),negToday=todayEs.filter(e=>e.type==="negative").reduce((a,e)=>a+e.points,0);const ranked=[...state.students].map(s=>({...s,...totals(s.id)})).sort((a,b)=>b.pos-a.pos).slice(0,5);const support=state.students.map(s=>({...s,...totals(s.id)})).filter(s=>s.neg>=5).length;const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];const bars=days.map((d,i)=>{let dt=new Date();dt.setDate(dt.getDate()-((dt.getDay()+6)%7)+(i));let ds=dt.toISOString().slice(0,10);let es=state.entries.filter(e=>e.date===ds);let p=es.filter(e=>e.type==="positive").reduce((a,e)=>a+e.points,0),n=es.filter(e=>e.type==="negative").reduce((a,e)=>a+e.points,0);return `<div class="bar-group"><div class="bars"><div class="bar pos" style="height:${Math.max(3,Math.min(100,p*8))}%"></div><div class="bar neg" style="height:${Math.max(3,Math.min(100,n*8))}%"></div></div><div class="bar-label">${d}</div></div>`;}).join("");c=$("content");c.innerHTML=pageHead("Good morning, Alex 👋","Here's what's happening across your school today.",`<button class="btn btn-outline" onclick="go('students')">＋ Add student</button><button class="btn btn-primary" onclick="go('award')">＋ Award points</button>`)+`<div class="grid stats">${stat("Total students",state.students.length,"♙","#eaf0ff","Across all active year groups")}${stat("Staff members","24","♧","#e8f7ef","Demo school directory")}${stat("Positive points today",posToday,"↗","#e8f7ef","Awarded so far today")}${stat("Negative points today",negToday,"↘","#fff0f0",`${support} students at review threshold`)}</div><div class="grid dashboard-grid"><section class="panel"><div class="panel-head"><h3>Points activity</h3><div class="legend"><span><i class="dot" style="background:#4b82e7"></i>Positive</span><span><i class="dot" style="background:#ee8b8b"></i>Negative</span></div></div><div class="panel-body"><div class="bar-chart">${bars}</div><div style="display:flex;justify-content:space-between;margin-top:18px;font-size:11px;color:var(--muted)"><span>Weekly overview · points by day</span><strong style="color:var(--text)">Net points: ${tt.pos-tt.neg}</strong></div></div></section><section class="panel"><div class="panel-head"><h3>Recent activity</h3><button class="btn btn-outline btn-sm" onclick="go('behaviour')">View all</button></div><div class="panel-body"><div class="activity">${[...state.entries].sort((a,b)=>b.id-a.id).slice(0,5).map(e=>{const s=student(e.studentId);return `<div class="activity-item"><div class="activity-icon" style="background:${e.type==="positive"?"var(--greenbg)":"var(--redbg)"};color:${e.type==="positive"?"var(--green)":"var(--red)"}">${e.type==="positive"?"↗":"↘"}</div><div class="activity-copy"><strong>${esc(s.first+" "+s.last)}</strong> ${e.type==="positive"?"received positive points":"received negative points"}<small>${esc(e.reason)} · ${e.date}</small></div><span class="pill ${e.type==="positive"?"pill-positive":"pill-negative"}">${e.type==="positive"?"+":"−"}${e.points}</span></div>`;}).join("")}</div></div></section></div><div class="grid two-col"><section class="panel"><div class="panel-head"><h3>Top positive points</h3><button class="btn btn-outline btn-sm" onclick="go('students')">Student directory</button></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Class</th><th>Positive</th><th>Net</th></tr></thead><tbody>${ranked.map(s=>`<tr><td><div class="student-cell"><div class="mini-avatar">${esc(initials(s))}</div><span class="student-name">${esc(s.first+" "+s.last)}</span></div></td><td>${esc(s.className)}</td><td style="color:var(--green);font-weight:800">+${s.pos}</td><td style="font-weight:800">${s.net}</td></tr>`).join("")}</tbody></table></div></section><section class="panel"><div class="panel-head"><h3>Quick actions</h3></div><div class="panel-body" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn btn-outline" style="padding:18px 8px" onclick="go('award')">＋<br><span style="font-size:12px">Award points</span></button><button class="btn btn-outline" style="padding:18px 8px" onclick="openStudentModal()">♙<br><span style="font-size:12px">Add student</span></button><button class="btn btn-outline" style="padding:18px 8px" onclick="go('reports')">▥<br><span style="font-size:12px">View reports</span></button><button class="btn btn-outline" style="padding:18px 8px" onclick="go('settings')">⚙<br><span style="font-size:12px">Points settings</span></button></div></section></div>`;}
function renderStudents(){const q=state.studentSearch||"";const list=state.students.filter(s=>`${s.first} ${s.last} ${s.id} ${s.className} ${s.year}`.toLowerCase().includes(q.toLowerCase()));$("content").innerHTML=pageHead("Student directory","Manage student records and view their behaviour and achievement history.",`<button class="btn btn-outline" onclick="importStudents()">⇧ Import CSV</button><button class="btn btn-primary" onclick="openStudentModal()">＋ Add student</button>`)+`<div class="panel"><div class="toolbar"><input id="studentSearch" placeholder="Search name, student ID, class…" value="${esc(q)}"><select id="studentYear"><option value="all">All year groups</option>${state.years.map(y=>`<option>${esc(y)}</option>`).join("")}</select><button class="btn btn-outline btn-sm" onclick="exportStudents()">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Student ID</th><th>Year group</th><th>Class</th><th>Positive</th><th>Negative</th><th>Net points</th><th>Status</th><th>Actions</th></tr></thead><tbody id="studentsBody">${list.map(studentRow).join("")||`<tr><td colspan="9"><div class="empty">No students found.</div></td></tr>`}</tbody></table></div><div class="table-foot"><span>${list.length} students</span><span>Local demo data</span></div></div>`;$("studentSearch").oninput=e=>{state.studentSearch=e.target.value;renderStudents();const el=$("studentSearch");el.focus();el.setSelectionRange(el.value.length,el.value.length);};$("studentYear").onchange=e=>{const val=e.target.value;const filtered=state.students.filter(s=>(val==="all"||s.year===val)&&`${s.first} ${s.last} ${s.id} ${s.className}`.toLowerCase().includes(($("studentSearch").value||"").toLowerCase()));$("studentsBody").innerHTML=filtered.map(studentRow).join("")||`<tr><td colspan="9"><div class="empty">No students found.</div></td></tr>`;};}
function studentRow(s){const t=totals(s.id);return `<tr><td><div class="student-cell"><div class="mini-avatar">${esc(initials(s))}</div><div><div class="student-name">${esc(s.first+" "+s.last)}</div><div class="subline">${esc(s.house||"No house")}</div></div></div></td><td>${esc(s.id)}</td><td>${esc(s.year)}</td><td>${esc(s.className)}</td><td style="color:var(--green);font-weight:800">+${t.pos}</td><td style="color:var(--red);font-weight:800">−${t.neg}</td><td style="font-weight:800">${t.net}</td><td><span class="pill pill-positive">${esc(s.status||"Active")}</span></td><td><button class="btn btn-outline btn-sm" onclick="viewStudent('${s.id}')">Profile</button> <button class="btn btn-outline btn-sm" onclick="openStudentModal('${s.id}')">Edit</button></td></tr>`;}
function renderBehaviour(){$("content").innerHTML=pageHead("Behaviour log","A complete, searchable history of positive and negative behaviour entries.",`<button class="btn btn-primary" onclick="go('award')">＋ Record entry</button>`)+`<div id="entryPanel">${entriesTable(filteredEntries())}</div>`;bindEntryFilters();}
function renderAward(){state.awardType=state.awardType||"positive";state.awardLevel=state.awardLevel||1;const isPos=state.awardType==="positive";$("content").innerHTML=pageHead("Award / record points","Record positive achievements and behaviour incidents consistently.")+`<div class="grid two-col"><section class="panel"><div class="panel-head"><h3>New behaviour entry</h3><span class="pill ${isPos?"pill-positive":"pill-negative"}">${isPos?"Positive points":"Negative points"}</span></div><div class="panel-body"><form id="awardForm"><div class="field"><label>Student *</label><select id="awardStudent" required><option value="">Select a student…</option>${state.students.map(s=>`<option value="${s.id}" ${state.awardStudent===s.id?"selected":""}>${esc(s.first+" "+s.last)} · ${esc(s.id)} · ${esc(s.className)}</option>`).join("")}</select></div><div id="studentContext" class="notice" style="margin-bottom:16px">Choose a student to see their year group and class.</div><div class="field"><label>Point category *</label><div class="actions"><button type="button" class="btn ${isPos?"btn-green":"btn-outline"}" id="typePositive">↗ Positive</button><button type="button" class="btn ${!isPos?"btn-red":"btn-outline"}" id="typeNegative">↘ Negative</button></div></div><div class="field"><label>Select level *</label><div class="level-grid" id="levelGrid">${renderLevelOptions()}</div></div><div class="field"><label>Points value</label><input id="awardPoints" type="number" min="1" max="100" required value="${state.levels[state.awardType][state.awardLevel-1].points}"><span class="muted" style="font-size:11px">Default value for the selected level. Admins can configure defaults in Points settings.</span></div><div class="field"><label>Reason *</label><select id="awardReason" required><option value="">Select a reason…</option>${(isPos?["Excellent class participation","Good effort","Outstanding effort","Helpful to others","Positive attitude","Exceptional achievement","Improved attendance","Other achievement"]:["Disruption to learning","Repeated lateness","Failure to follow instructions","Unsafe behaviour","Inappropriate language","Damage to property","Bullying concern","Other behaviour concern"]).map(r=>`<option>${esc(r)}</option>`).join("")}</select></div><div class="field"><label>Staff comment ${isPos?"(optional)":"(recommended)"}</label><textarea id="awardNote" rows="3" placeholder="Add relevant context or follow-up information…"></textarea></div><div class="form-grid"><div class="field"><label>Date *</label><input type="date" id="awardDate" value="${today}" required></div><div class="field"><label>Recorded by *</label><input id="awardStaff" value="Alex Morgan" required></div><div class="field span-2"><label>Follow-up status</label><select id="awardStatus"><option>Recorded</option><option>For review</option><option>Follow-up required</option><option>Awaiting approval</option></select></div></div><div id="negativeNotice" class="notice ${isPos?"hidden":""}" style="margin-bottom:15px">Negative entries are retained in the behaviour history. Level 4–5 incidents should be reviewed by authorised staff according to school policy.</div><button class="btn btn-primary full" type="submit">Save behaviour entry</button></form></div></section><section><div class="panel"><div class="panel-head"><h3>Student points summary</h3></div><div class="panel-body" id="awardSummary"><div class="empty"><div class="big">♙</div>Select a student to view their current totals.</div></div></div><div class="panel" style="margin-top:17px"><div class="panel-head"><h3>Level guide</h3></div><div class="panel-body"><div style="display:grid;gap:12px">${[1,2,3,4,5].map(n=>`<div style="display:flex;align-items:flex-start;gap:10px"><div class="mini-avatar" style="background:${isPos?"var(--greenbg)":"var(--redbg)"};color:${isPos?"var(--green)":"var(--red)"}">L${n}</div><div style="font-size:12px"><strong>${esc(state.levels[state.awardType][n-1].name)} · ${state.levels[state.awardType][n-1].points} point${state.levels[state.awardType][n-1].points===1?"":"s"}</strong><div class="muted" style="margin-top:3px">${esc(state.levels[state.awardType][n-1].description)}</div></div></div>`).join("")}</div></div></div></section></div>`;const st=$("awardStudent");st.onchange=()=>{state.awardStudent=st.value;updateAwardSummary();};$("typePositive").onclick=()=>{state.awardType="positive";renderAward();};$("typeNegative").onclick=()=>{state.awardType="negative";renderAward();};document.querySelectorAll(".level-option").forEach(b=>b.onclick=()=>{state.awardLevel=Number(b.dataset.level);renderAward();});$("awardForm").onsubmit=submitAward;if(state.awardStudent){st.value=state.awardStudent;updateAwardSummary();}}
function renderLevelOptions(){return [1,2,3,4,5].map(n=>{const l=state.levels[state.awardType][n-1],sel=state.awardLevel===n;return `<button type="button" class="level-option ${sel?(state.awardType==="positive"?"selected":"neg-selected"):""}" data-level="${n}"><strong>${n}</strong><span>${l.points} point${l.points===1?"":"s"}</span></button>`;}).join("");}
function updateAwardSummary(){const s=student(state.awardStudent);if(!s.id||!state.students.some(x=>x.id===s.id))return;$("studentContext").innerHTML=`<strong>${esc(s.year)} · ${esc(s.className)}</strong><br>${esc(s.first+" "+s.last)} · ${esc(s.id)}`;const t=totals(s.id);$("awardSummary").innerHTML=`<div class="student-cell" style="margin-bottom:20px"><div class="profile-avatar">${esc(initials(s))}</div><div><strong>${esc(s.first+" "+s.last)}</strong><div class="muted" style="font-size:12px;margin-top:4px">${esc(s.year)} · ${esc(s.className)}</div></div></div><div class="grid profile-stats">${stat("Positive",t.pos,"↗","#e8f7ef","Total positive points")}${stat("Negative",t.neg,"↘","#fff0f0","Total negative points")}${stat("Net points",t.net,"∑","#eaf0ff","Positive minus negative")}</div><h4 style="font-size:12px;margin:22px 0 12px">Recent history</h4><div class="activity">${state.entries.filter(e=>e.studentId===s.id).sort((a,b)=>b.id-a.id).slice(0,4).map(e=>`<div class="activity-item"><div class="activity-icon" style="background:${e.type==="positive"?"var(--greenbg)":"var(--redbg)"}">${e.type==="positive"?"↗":"↘"}</div><div class="activity-copy"><strong>${esc(e.reason)}</strong><small>Level ${e.level} · ${e.date}</small></div><span class="pill ${e.type==="positive"?"pill-positive":"pill-negative"}">${e.type==="positive"?"+":"−"}${e.points}</span></div>`).join("")||`<span class="muted" style="font-size:12px">No history yet.</span>`}</div>`;}
function submitAward(ev){ev.preventDefault();const sid=$("awardStudent").value,reason=$("awardReason").value,points=Number($("awardPoints").value);if(!sid||!reason||!points||points<1){showToast("Please complete all required fields.");return;}const type=state.awardType,level=state.awardLevel;if(type==="negative"&&!confirm(`Record ${points} negative point(s) for ${student(sid).first} ${student(sid).last}? This will be added to their behaviour history.`))return;const e={id:Date.now(),studentId:sid,type,level,points,reason,note:$("awardNote").value.trim(),staff:$("awardStaff").value.trim(),date:$("awardDate").value,status:$("awardStatus").value};state.entries.push(e);saveData();showToast("Behaviour entry saved successfully.");state.awardStudent=sid;renderAward();updateAwardSummary();}
function renderClasses(){$("content").innerHTML=pageHead("Classes & year groups","View and manage the class groups used throughout the MIS.",`<button class="btn btn-primary" onclick="openClassModal()">＋ Add class</button>`)+`<div class="grid stats">${stat("Year groups",state.years.length,"▤","#eaf0ff","Configured year groups")}${stat("Classes",state.classes.length,"▦","#e8f7ef","Tutor and teaching groups")}${stat("Students assigned",state.students.length,"♙","#fff5d9","Across listed classes")}${stat("Houses",new Set(state.students.map(s=>s.house).filter(Boolean)).size,"♧","#f0eaff","Student house groups")}</div><div class="panel"><div class="panel-head"><h3>Class directory</h3></div><div class="table-wrap"><table><thead><tr><th>Class</th><th>Year group</th><th>Students</th><th>Assigned students</th><th>Actions</th></tr></thead><tbody>${state.classes.map(c=>{let year=state.students.find(s=>s.className===c)?.year||"Not assigned";let count=state.students.filter(s=>s.className===c).length;return `<tr><td><strong>${esc(c)}</strong></td><td>${esc(year)}</td><td>${count}</td><td><div style="width:150px;height:6px;background:#edf1f7;border-radius:10px;overflow:hidden"><div style="height:100%;background:var(--blue);width:${Math.min(100,count*12)}%"></div></div></td><td><button class="btn btn-outline btn-sm" onclick="showClassStudents('${esc(c)}')">View students</button></td></tr>`;}).join("")}</tbody></table></div></div><div class="notice" style="margin-top:15px">This prototype stores class assignments locally. Production deployments should connect these records to a secure shared database and permission system.</div>`;}
function renderReports(){const t=allTotals(),positive=state.entries.filter(e=>e.type==="positive").length,negative=state.entries.filter(e=>e.type==="negative").length;const levelRows=[1,2,3,4,5].map(n=>{let p=state.entries.filter(e=>e.type==="positive"&&e.level===n).length,neg=state.entries.filter(e=>e.type==="negative"&&e.level===n).length;return `<tr><td>Level ${n}</td><td>${p}</td><td>${neg}</td><td>${p+neg}</td></tr>`;}).join("");$("content").innerHTML=pageHead("Reports & analytics","Explore points distribution and export a snapshot of your school's demo data.",`<button class="btn btn-outline" onclick="exportEntries()">⇩ Export behaviour CSV</button><button class="btn btn-primary" onclick="window.print()">Print report</button>`)+`<div class="grid stats">${stat("Positive points",t.pos,"↗","#e8f7ef",`${positive} positive entries`)}${stat("Negative points",t.neg,"↘","#fff0f0",`${negative} negative entries`)}${stat("Net points",t.pos-t.neg,"∑","#eaf0ff","Positive minus negative")}${stat("Review flagged",state.entries.filter(e=>e.status!=="Recorded").length,"!","#fff5d9","Entries needing attention")}</div><div class="grid two-col"><div class="panel"><div class="panel-head"><h3>Points by level</h3></div><div class="table-wrap"><table><thead><tr><th>Level</th><th>Positive entries</th><th>Negative entries</th><th>Total</th></tr></thead><tbody>${levelRows}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3>Students reaching review threshold</h3></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Class</th><th>Negative total</th></tr></thead><tbody>${state.students.map(s=>({...s,...totals(s.id)})).filter(s=>s.neg>=5).sort((a,b)=>b.neg-a.neg).map(s=>`<tr><td>${esc(s.first+" "+s.last)}</td><td>${esc(s.className)}</td><td><span class="pill pill-negative">${s.neg} points</span></td></tr>`).join("")||`<tr><td colspan="3" class="muted">No students currently meet the demo threshold (5 negative points).</td></tr>`}</tbody></table></div></div></div><div class="panel" style="margin-top:17px"><div class="panel-head"><h3>Student points summary</h3><button class="btn btn-outline btn-sm" onclick="exportStudents()">Export student CSV</button></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Class</th><th>Positive</th><th>Negative</th><th>Net</th></tr></thead><tbody>${state.students.map(s=>{let x=totals(s.id);return `<tr><td>${esc(s.first+" "+s.last)}</td><td>${esc(s.className)}</td><td style="color:var(--green)">+${x.pos}</td><td style="color:var(--red)">−${x.neg}</td><td><strong>${x.net}</strong></td></tr>`;}).join("")}</tbody></table></div></div>`;}
function renderSettings(){$("content").innerHTML=pageHead("Points settings","Configure point values and descriptions for all ten behaviour levels.")+`<div class="notice" style="margin-bottom:17px">Changes apply to future entries. Existing behaviour entries retain the points originally recorded. Level 4–5 negative entries should trigger human review according to your school policy.</div><div class="grid two-col">${["positive","negative"].map(type=>`<section class="panel"><div class="panel-head"><h3>${type==="positive"?"↗ Positive points":"↘ Negative points"}</h3><span class="pill ${type==="positive"?"pill-positive":"pill-negative"}">5 levels</span></div><div class="panel-body"><div class="level-row" style="font-size:10px;font-weight:800;color:var(--muted)"><span>LEVEL</span><span>POINTS</span><span>DESCRIPTION</span></div>${state.levels[type].map((l,i)=>`<div class="level-row"><strong>${esc(l.name)}</strong><input type="number" min="1" max="100" id="${type}Points${i+1}" value="${l.points}" aria-label="${type} level ${i+1} points"><input id="${type}Desc${i+1}" value="${esc(l.description)}" aria-label="${type} level ${i+1} description"></div>`).join("")}</div></section>`).join("")}</div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:17px"><button class="btn btn-outline" onclick="resetLevels()">Reset defaults</button><button class="btn btn-primary" onclick="saveLevels()">Save points settings</button></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Data management</h3></div><div class="panel-body" style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><strong style="font-size:13px">Local demo data</strong><p class="muted" style="font-size:12px;margin:5px 0 0">Data is stored in this browser on this device only.</p></div><button class="btn btn-red" onclick="resetDemo()">Reset all demo data</button></div></div>`;}
function saveLevels(){["positive","negative"].forEach(type=>state.levels[type].forEach((l,i)=>{let p=Number($(`${type}Points${i+1}`).value);l.points=Math.max(1,Math.min(100,p||1));l.description=$(`${type}Desc${i+1}`).value.trim()||l.description;}));saveData();showToast("Points settings saved.");renderSettings();}

function attendanceStatusChanged(id){

function timetableText(st){
 const tt=st.timetable||{};return ["Monday","Tuesday","Wednesday","Thursday","Friday"].map(day=>`${day}\n${(tt[day]||[]).map(x=>`${x.time||""} | ${x.subject||""} | ${x.teacher||""}`).join("\n")}`).join("\n\n");
}
function parseTimetableText(value){
 const out={};let day="Monday";out[day]=[];
 value.split(/\r?\n/).forEach(line=>{const t=line.trim();if(!t)return;const d=t.match(/^(Monday|Tuesday|Wednesday|Thursday|Friday)$/i);if(d){day=d[1][0].toUpperCase()+d[1].slice(1).toLowerCase();out[day]=out[day]||[];return;}const parts=t.split("|").map(x=>x.trim());if(parts.length>=2&&(parts[0]||parts[1]))out[day].push({time:parts[0],subject:parts[1],teacher:parts.slice(2).join(" | ")});});return out;
}

function getStudentSupportStatus(s){

}

}

function saveStudent(oldId){
 const id=$("sId").value.trim(), first=$("sFirst").value.trim(), last=$("sLast").value.trim();
 if(!id||!first||!last)return showToast("Complete the required student fields.");
 if(!oldId&&state.students.some(s=>s.id===id))return showToast("That student ID already exists.");
 const old=oldId?state.students.find(x=>x.id===oldId):null;
 const supportStatus=$("sStatus").value;
 const s={...(old||{}),id,first,last,year:$("sYear").value,className:$("sClass").value,house:$("sHouse").value.trim(),status:(old?.status==="Suspended"||old?.status==="Expelled")?old.status:"Active",supportStatus:isAdmin()?supportStatus:getStudentSupportStatus(old||{status:"Active"})};
 if(oldId){const i=state.students.findIndex(x=>x.id===oldId);state.students[i]=s;}else state.students.push(s);
 saveData();closeModal();showToast(oldId?"Student updated.":"Student added.");renderStudents();
}
// The student profile contains the support-status selector. Suspension/expulsion remains a separate, higher-priority status.

 // Use the existing full profile, then add status controls and preserve its existing note/timetable editing.

     if(heading)heading.parentNode.insertBefore(holder.firstElementChild,heading);
   }

const _statusEnhancedSaveStudentProfile=saveStudentProfile;
saveStudentProfile=function(id){

   const chosen=$("profileSupportStatus")?.value;
   if(chosen&&["Neutral","On report","Urgent Attention"].includes(chosen))s.supportStatus=chosen;
 }

// Show the overriding disciplinary status first, with the support status beneath it.
studentRow=function(s){

const _statusEnhancedManageStudentStatus=manageStudentStatus;
manageStudentStatus=function(id,status){
 if(!isAdmin())return showToast("Only an admin can suspend or expel students.");
 const s=student(id);if(!s)return;
 if(status==="Active"){
   if(!confirm(`Reinstate ${s.first} ${s.last}? Their support status will remain ${getStudentSupportStatus(s)}.`))return;
   s.status="Active";saveData();showToast("Student reinstated.");renderStudents();return;
 }
 if(status!=="Suspended"&&status!=="Expelled")return;
 if(!confirm(`Set ${s.first} ${s.last} to ${status}? This will restrict their student login. Their support status will remain ${getStudentSupportStatus(s)}.`))return;
 s.status=status;saveData();showToast(`Student status updated: ${status}.`);renderStudents();
};

// Organise the sidebar into collapsible groups without changing page behaviour.
const SIDEBAR_GROUPS = [
  {id:"overview", title:"Overview", pages:["dashboard","staffdashboard"]},
  {id:"students", title:"Students", pages:["students","studentprofile","studentpoints","studenttimetable","studentachievements","parentportal"]},
  {id:"teaching", title:"Teaching & learning", pages:["attendance","attendanceDashboard","learning","cover","calendar"]},
  {id:"behaviour", title:"Behaviour & pastoral", pages:["behaviour","award","rewards","detentions","pastoral"]},
  {id:"communication", title:"Communication", pages:["alerts","noticeboard","messages"]},
  {id:"management", title:"School management", pages:["classes","reports","settings","users","permissions","audit","globalSearch"]}
];
function organiseSidebar(){
  const sidebar=$("sidebar"); if(!sidebar)return;
  const brand=sidebar.querySelector(".side-brand"), bottom=sidebar.querySelector(".side-bottom");
  if(!brand||!bottom)return;
  const buttons=[...sidebar.querySelectorAll(".nav-btn")];
  sidebar.querySelectorAll(":scope > .nav-label, :scope > .nav-group").forEach(el=>el.remove());
  const byPage=new Map(buttons.map(b=>[b.dataset.page,b]));
  const assigned=new Set();
  SIDEBAR_GROUPS.forEach(group=>{
    const items=group.pages.map(page=>byPage.get(page)).filter(Boolean);
    if(!items.length)return;
    const details=document.createElement("details"); details.className="nav-group"; details.dataset.group=group.id;
    const summary=document.createElement("summary"); summary.textContent=group.title;
    const list=document.createElement("div"); list.className="nav-group-items";
    items.forEach(button=>{list.appendChild(button);assigned.add(button.dataset.page);});
    details.append(summary,list); sidebar.insertBefore(details,bottom);
  });
  const leftovers=buttons.filter(b=>!assigned.has(b.dataset.page));
  if(leftovers.length){
    const details=document.createElement("details");details.className="nav-group";details.dataset.group="other";
    const summary=document.createElement("summary");summary.textContent="Other";
    const list=document.createElement("div");list.className="nav-group-items";leftovers.forEach(b=>list.appendChild(b));details.append(summary,list);sidebar.insertBefore(details,bottom);
  }
  sidebar.querySelectorAll(".nav-group").forEach(group=>{
    const visible=[...group.querySelectorAll(".nav-btn")].filter(b=>!b.classList.contains("hidden"));
    group.hidden=visible.length===0;
    const hasActive=visible.some(b=>b.dataset.page===state.currentPage||b.classList.contains("active"));
    group.open=hasActive || group.dataset.group==="overview";
  });
}

  </div>`,`<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUser()">Create account</button>`);
  updateAccountLinkField();
};
updateAccountLinkField=function(){
  const role=$("uRole")?.value,field=$("uStudentField"),sel=$("uStudent"),label=$("uStudentLabel"),help=$("uStudentHelp");
  if(!field||!sel)return;
  const linkedRequired=role==="Student"||role==="Parent";
  field.classList.toggle("hidden",!linkedRequired);
  sel.required=linkedRequired;
  label.textContent=role==="Parent"?"Link to their child *":"Link student record *";
  help.textContent=role==="Parent"?"Choose the child this parent or carer is allowed to view. Multiple parent accounts can link to the same student.":"Student accounts must be linked to a student record.";
};


// Parent portal tabs: each tab switches to a distinct, working parent view.
let parentPortalActiveTab = "overview";
function setParentPortalTab(tab){
  const allowed=["overview","attendance","points","assignments","calendar","profile"];
  parentPortalActiveTab=allowed.includes(tab)?tab:"overview";
  renderParentPortal();
}
renderParentPortal=function(){
  const u=state.currentUser||{},s=u.studentId?student(u.studentId):null;
  const tabs=[["overview","Overview"],["attendance","Attendance"],["points","Points"],["assignments","Assignments"],["calendar","Calendar & notices"],["profile","Student profile"]];
  const tabBar=`<div class="parent-tabs" role="tablist" aria-label="Parent portal sections">${tabs.map(([id,label])=>`<button type="button" role="tab" aria-selected="${parentPortalActiveTab===id}" class="btn ${parentPortalActiveTab===id?"btn-primary":"btn-outline"} parent-tab" onclick="setParentPortalTab('${id}')">${label}</button>`).join("")}</div>`;
  if(!s){
    $("content").innerHTML=featurePage("Parent portal","Parent and carer view for linked student records.")+tabBar+`<div class="notice">This parent account is not linked to a student. An Admin can edit the account under School Management → Users and link it to a fictional student.</div>`;
    return;
  }
  const t=totals(s.id),att=(state.attendance||[]).filter(a=>a.studentId===s.id),
    present=att.filter(a=>a.status==="Present").length,
    pct=att.length?Math.round(present/att.length*100):null,
    assign=(state.assignments||[]).filter(a=>a.studentId===s.id||(!a.studentId&&a.className===s.className)),
    entries=(state.entries||[]).filter(e=>e.studentId===s.id).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))),
    events=(state.schoolEvents||[]).filter(e=>["Everyone","Parents"].includes(e.audience)&&(!e.date||e.date>=today)),
    notices=(state.notices||[]).filter(n=>!n.expires||n.expires>=today),
    alerts=(state.alerts||[]).filter(a=>[4,5].includes(Number(a.category))&&(!a.expires||a.expires>=today));
  let body="";
  if(parentPortalActiveTab==="overview"){
    body=`<div class="grid stats">${stat("Attendance",pct===null?"—":pct+"%","✓","#e8f7ef",att.length+" records")}${stat("Positive points",t.pos,"★","#e8f7ef","Positive points")}${stat("Assignments due",assign.filter(a=>!a.completed).length,"▣","#eaf0ff","Incomplete assignments")}${stat("Upcoming events",events.length,"▦","#fff5d9","Shared with parents")}</div>
    <div class="grid two-col"><section class="panel"><div class="panel-head"><h3>Recent attendance</h3><button class="btn btn-outline btn-sm" onclick="setParentPortalTab('attendance')">View all</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody>${att.slice(-5).reverse().map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.status)}</td></tr>`).join("")||'<tr><td colspan="2">No attendance records yet.</td></tr>'}</tbody></table></div></section>
    <section class="panel"><div class="panel-head"><h3>Assignments</h3><button class="btn btn-outline btn-sm" onclick="setParentPortalTab('assignments')">View all</button></div><div class="panel-body">${assign.slice(0,5).map(a=>`<div class="activity-item"><div class="activity-copy"><strong>${esc(a.title)}</strong><small>Due ${esc(a.dueDate||"—")}</small></div><span class="pill ${a.completed?"pill-positive":"pill-amber"}">${a.completed?"Completed":"To do"}</span></div>`).join("")||'<div class="empty">No assignments.</div>'}</div></section></div>
    <div class="grid two-col" style="margin-top:16px"><section class="panel"><div class="panel-head"><h3>Student alerts</h3></div><div class="panel-body">${alerts.map(a=>`<div class="alert-card" style="margin-bottom:10px"><strong>${esc(a.title)}</strong><p>${esc(a.body)}</p></div>`).join("")||'<div class="muted">No current student alerts.</div>'}</div></section><section class="panel"><div class="panel-head"><h3>Notice board</h3></div><div class="panel-body">${notices.slice(0,5).map(n=>`<div class="notice-card" style="margin-bottom:10px"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p></div>`).join("")||'<div class="muted">No notices.</div>'}</div></section></div>`;
  } else if(parentPortalActiveTab==="attendance"){
    body=`<div class="grid stats">${stat("Attendance",pct===null?"—":pct+"%","✓","#e8f7ef",att.length+" recorded sessions")}${stat("Present",present,"✓","#e8f7ef","Marked present")}${stat("Absent",att.filter(a=>a.status==="Absent").length,"!","#fff0f0","Recorded absences")}${stat("Late",att.filter(a=>a.status==="Late").length,"◷","#fff5d9","Late arrivals")}</div><div class="panel"><div class="panel-head"><h3>Attendance history</h3></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Status</th><th>Session</th></tr></thead><tbody>${att.slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).map(a=>`<tr><td>${esc(a.date||"—")}</td><td>${esc(a.status||"—")}</td><td>${esc(a.period||a.lesson||"—")}</td></tr>`).join("")||'<tr><td colspan="3">No attendance records yet.</td></tr>'}</tbody></table></div></div>`;
  } else if(parentPortalActiveTab==="points"){
    body=`<div class="grid stats">${stat("Positive points",t.pos,"★","#e8f7ef","Total positive points")}${stat("Negative points",t.neg,"!","#fff0f0","Total negative points")}${stat("Net points",t.net,"∑","#eaf0ff","Overall total")}</div><div class="panel"><div class="panel-head"><h3>Points history</h3></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Reason</th><th>Points</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${esc(e.date||"—")}</td><td>${esc(e.type||"—")}</td><td>${esc(e.reason||e.description||"—")}</td><td>${e.type==="negative"?"−":"+"}${Number(e.points)||0}</td></tr>`).join("")||'<tr><td colspan="4">No points entries yet.</td></tr>'}</tbody></table></div></div>`;
  } else if(parentPortalActiveTab==="assignments"){
    body=`<div class="panel"><div class="panel-head"><h3>Assignments and homework</h3><span class="muted">${assign.length} items</span></div><div class="table-wrap"><table><thead><tr><th>Assignment</th><th>Subject</th><th>Due date</th><th>Status</th></tr></thead><tbody>${assign.map(a=>`<tr><td><strong>${esc(a.title||"Assignment")}</strong></td><td>${esc(a.subject||"—")}</td><td>${esc(a.dueDate||"—")}</td><td><span class="pill ${a.completed?"pill-positive":"pill-amber"}">${a.completed?"Completed":"To do"}</span></td></tr>`).join("")||'<tr><td colspan="4">No assignments available.</td></tr>'}</tbody></table></div></div>`;
  } else if(parentPortalActiveTab==="calendar"){
    body=`<div class="grid two-col"><section class="panel"><div class="panel-head"><h3>Upcoming events</h3></div><div class="panel-body">${events.slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))).map(e=>`<div class="activity-item"><div class="activity-copy"><strong>${esc(e.title)}</strong><small>${esc(e.date||"Date to be confirmed")} · ${esc(e.audience||"Everyone")}</small><p>${esc(e.details||"")}</p></div></div>`).join("")||'<div class="empty">No upcoming events.</div>'}</div></section><section class="panel"><div class="panel-head"><h3>School notices</h3></div><div class="panel-body">${notices.map(n=>`<div class="notice-card" style="margin-bottom:10px"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p></div>`).join("")||'<div class="empty">No current notices.</div>'}</div></section></div>`;
  } else {
    body=`<div class="panel"><div class="panel-head"><h3>Student details</h3></div><div class="panel-body"><div class="grid two-col"><div><small class="muted">Full name</small><p><strong>${esc(s.first+" "+s.last)}</strong></p></div><div><small class="muted">Student ID</small><p><strong>${esc(s.id)}</strong></p></div><div><small class="muted">Year group</small><p><strong>${esc(s.year||"—")}</strong></p></div><div><small class="muted">Class</small><p><strong>${esc(s.className||"—")}</strong></p></div><div><small class="muted">House</small><p><strong>${esc(s.house||"—")}</strong></p></div><div><small class="muted">Status</small><p><strong>${esc(s.status||"Active")}</strong></p></div></div><div class="notice">This is a demo parent view. Contact details and sensitive records should only be shown after appropriate school verification and access controls.</div></div></div>`;
  }
  $("content").innerHTML=featurePage("Parent portal",`Linked student: ${esc(s.first+" "+s.last)} · ${esc(s.year)} · ${esc(s.className)}`)+tabBar+body;
};

loadData();
const savedLogin=sessionStorage.getItem("schoolMISLoggedIn");
if(savedLogin){const account=state.accounts.find(a=>a.username===savedLogin);if(account){state.currentUser=account;$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");setupRoleNav();go(staffRole()?"dashboard":"studenthome");}}
else { $("username").value="admin"; $("password").value="School123!"; }
</script>

<style>
#arbor-data-tools {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 99999;
  font-family: Arial, sans-serif;
}
#arbor-data-toggle {

  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  font-weight: bold;

}
#arbor-data-panel {
  display: none;
  width: min(340px, calc(100vw - 36px));
  margin-bottom: 10px;
  padding: 19px;
  border: 1px solid #dbe5f0;
  border-radius: 16px;
  background: white;
  color: #172554;
  box-shadow: 0 12px 40px #17255425;
}
#arbor-data-panel.open { display: block; }
#arbor-data-panel h3 { margin: 0 0 6px; }
#arbor-data-panel p { font-size: 13px; color: #64748b; }
.arbor-data-action {
  display: block;
  width: 100%;
  padding: 11px;
  margin-top: 9px;
  border: 1px solid #dbe5f0;
  border-radius: 9px;
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: bold;
  text-align: left;

}

  font-size: 12px;
  overflow-wrap: anywhere;

</style>

<div id="arbor-data-tools">
  <div id="arbor-data-panel">
    <h3>Data Management</h3>
    <p>Save and restore your Arbor MIS data offline.</p>

    <button class="arbor-data-action" onclick="arborSaveData()">
      ↓ Save / Export Data
    </button>

    <button class="arbor-data-action" onclick="arborBackupData()">
      🛡 Create Backup
    </button>

    <button class="arbor-data-action" onclick="arborChooseImport()">
      ↑ Load / Restore Data
    </button>

    <input
      id="arbor-data-file"
      type="file"
      accept=".json,application/json"
      hidden
      onchange="arborImportData(event)"
    >

    <p id="arbor-data-status" role="status">
      Ready. Export a backup before restoring data.
    </p>
  </div>

  <button
    id="arbor-data-toggle"
    onclick="arborToggleDataPanel()"
    aria-expanded="false"
  >
    ⚙ Data Management
  </button>
</div>

<script>
(function () {
  const STORAGE_PREFIX = "arbor-mis-backup";

  window.arborToggleDataPanel = function () {
    const panel = document.getElementById("arbor-data-panel");
    const button = document.getElementById("arbor-data-toggle");
    const open = panel.classList.toggle("open");
    button.setAttribute("aria-expanded", String(open));
  };

  function setStatus(message) {
    document.getElementById("arbor-data-status").textContent = message;
  }

  function getStoredData() {
    const data = {};

    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key !== null) {
        data[key] = localStorage.getItem(key);
      }
    }

    return data;
  }

  function downloadJSON(data, filename) {
    const blob = new Blob(
      [JSON.stringify(data, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function makeBackup() {
    return {
      format: "arbor-mis-json-backup",
      version: 1,
      createdAt: new Date().toISOString(),
      storageType: "localStorage",
      data: getStoredData()
    };
  }

  window.arborSaveData = function () {
    const backup = makeBackup();
    const date = new Date().toISOString().slice(0, 10);

    downloadJSON(backup, "arbor-mis-data-" + date + ".json");
    setStatus("Export prepared. Check your Downloads folder.");
  };

  window.arborBackupData = function () {
    const backup = makeBackup();
    const date = new Date().toISOString()
      .replace(/[:.]/g, "-");

    downloadJSON(backup, STORAGE_PREFIX + "-" + date + ".json");
    setStatus("Backup prepared. Keep the downloaded file somewhere safe.");
  };

  window.arborChooseImport = function () {
    const input = document.getElementById("arbor-data-file");
    input.value = "";
    input.click();
  };

  window.arborImportData = async function (event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    try {
      const text = await file.text();
      const backup = JSON.parse(text);

      if (
        !backup ||
        backup.format !== "arbor-mis-json-backup" ||
        backup.version !== 1 ||
        !backup.data ||
        typeof backup.data !== "object" ||
        Array.isArray(backup.data)
      ) {
        throw new Error("This is not a recognised Arbor MIS backup.");
      }

      for (const [key, value] of Object.entries(backup.data)) {
        if (
          typeof key !== "string" ||
          typeof value !== "string" ||
          key === "__proto__"
        ) {
          throw new Error("The backup contains invalid data.");
        }
      }

      const currentData = getStoredData();
      const confirmed = confirm(
        "Restore this backup?\n\n" +
        "This will replace the current browser's saved data " +
        "with the data in the selected file.\n\n" +
        "A backup of the current data will download first."
      );

      if (!confirmed) {
        setStatus("Restore cancelled. Current data was not changed.");
        return;
      }

      downloadJSON(
        {
          format: "arbor-mis-json-backup",
          version: 1,
          createdAt: new Date().toISOString(),
          storageType: "localStorage",
          data: currentData
        },
        "arbor-mis-before-restore-" +
          new Date().toISOString().slice(0, 10) + ".json"
      );

      // Save the current state in memory in case importing fails.
      const previous = getStoredData();

      try {
        localStorage.clear();

        for (const [key, value] of Object.entries(backup.data)) {
          localStorage.setItem(key, value);
        }
      } catch (error) {
        localStorage.clear();

        for (const [key, value] of Object.entries(previous)) {
          localStorage.setItem(key, value);
        }

        throw error;
      }

      setStatus("Restore complete. Reloading the MIS…");
      alert(
        "Data restored successfully. The MIS will reload to display the restored data."
      );
      location.reload();

    } catch (error) {
      setStatus("Could not restore: " + error.message);
      alert("Restore failed: " + error.message);
    } finally {
      event.target.value = "";
    }
  };
})();
</script>
